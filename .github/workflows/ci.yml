name: EventPulse verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventpulse
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: eventpulse_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U eventpulse -d eventpulse_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      PG_TEST_URL: postgresql+psycopg://eventpulse:ci-synthetic-only@localhost:5432/eventpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m ruff check backend/app backend/tests scripts
      - run: cd backend && python -m pytest -q --junitxml=../evidence/ci-backend-junit.xml
      - run: cd frontend && npm ci && npm test && npm run build
      - name: Start API
        run: cd backend && python -m uvicorn app.server:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - name: Validate Prometheus rules
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.2.1 check rules /etc/prometheus/alerts.yml
      - name: Build Docker images
        run: docker build -f backend/Dockerfile -t eventpulse-api . && docker build -f frontend/Dockerfile -t eventpulse-web .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            evidence/
            docs/screenshots/
