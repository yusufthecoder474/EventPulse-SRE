services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventpulse
      POSTGRES_USER: eventpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py first}
    volumes:
    - pgdata:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U eventpulse -d eventpulse
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    stop_grace_period: 20s
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://eventpulse:${POSTGRES_PASSWORD}@db:5432/eventpulse
      ENABLE_FAULTS: 'false'
      APP_ENV: local
      ENABLE_PROCESS_CRASH_TEST: ${ENABLE_PROCESS_CRASH_TEST:-false}
      OBSERVATION_WINDOW_SECONDS: 60
      EVIDENCE_PATH: /app/evidence/experiments.json
    ports:
    - 127.0.0.1:8000:8000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
    - 127.0.0.1:8080:80
    depends_on:
    - api
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - promdata:/prometheus
    ports:
    - 127.0.0.1:9090:9090
    depends_on:
    - api
    restart: unless-stopped
  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
    - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
    - 127.0.0.1:9093:9093
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run scripts/bootstrap.py first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafanadata:/var/lib/grafana
    ports:
    - 127.0.0.1:3000:3000
    restart: unless-stopped
volumes:
  pgdata: null
  promdata: null
  grafanadata: null
